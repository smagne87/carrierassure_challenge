name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint || true

      - name: Check code formatting (Prettier)
        working-directory: backend
        run: npx prettier --check "src/**/*.ts" || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:cov

      - name: Check coverage threshold
        working-directory: backend
        run: |
          echo "Checking coverage threshold (≥70% on scoring logic)..."
          # Extract coverage for scoring.domain-service.ts
          SCORING_COVERAGE=$(cat coverage/coverage-summary.json | jq -r '."src/domain/carrier/services/scoring.domain-service.ts".lines.pct')
          echo "Scoring logic coverage: $SCORING_COVERAGE%"

          # Check if coverage meets threshold
          if (( $(echo "$SCORING_COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage $SCORING_COVERAGE% is below 70% threshold"
            exit 1
          fi

          echo "✅ Coverage threshold met: $SCORING_COVERAGE% ≥ 70%"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
          fail_ci_if_error: false

  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: carrier-scoring-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image was built
        run: |
          echo "✅ Docker image built successfully"
          docker images | grep carrier-scoring-api || echo "Image built and cached"

  integration-test:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with docker compose
        run: |
          echo "Starting all services with docker compose..."
          # Use production target for faster startup in CI
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Check container status and logs
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          echo ""
          echo "=== Database Logs (last 50 lines) ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=50 db
          echo ""
          echo "=== API Logs (last 100 lines) ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=100 api
          echo ""

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend API to be healthy..."
          echo "Using production build for faster startup in CI..."

          # Monitor health status
          for i in {1..24}; do
            echo "Attempt $i/24 at $(date +%T)"

            # Check container health status (using CI container name)
            API_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' carrier-scoring-api-ci 2>/dev/null || echo "unknown")
            echo "  Container health status: $API_HEALTH"

            # Try to curl the endpoint
            if curl -f http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "✅ Backend API is healthy and responding!"
              exit 0
            fi

            # If unhealthy, show recent logs
            if [ "$API_HEALTH" = "unhealthy" ]; then
              echo "  ⚠️  Container marked as unhealthy. Recent logs:"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=20 api
            fi

            sleep 5
          done

          echo "❌ Timeout waiting for API to be healthy"
          echo ""
          echo "=== Final API Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api
          exit 1

      - name: Run integration smoke tests
        run: |
          echo "Running smoke tests against docker-compose stack..."

          # Test 1: Health endpoint
          echo "Test 1: Health endpoint"
          HEALTH_RESPONSE=$(curl -s http://localhost:3001/api/health)
          echo "Response: $HEALTH_RESPONSE"
          echo "$HEALTH_RESPONSE" | jq -e '.status == "ok"' || exit 1
          echo "✅ Health check passed"

          # Test 2: Carriers endpoint (empty initially)
          echo "Test 2: Carriers endpoint (should be empty)"
          CARRIERS_RESPONSE=$(curl -s http://localhost:3001/api/carriers)
          echo "Response: $CARRIERS_RESPONSE"
          CARRIER_COUNT=$(echo "$CARRIERS_RESPONSE" | jq 'length')
          if [ "$CARRIER_COUNT" -eq 0 ]; then
            echo "✅ Carriers endpoint returns empty array as expected"
          else
            echo "❌ Expected empty array, got $CARRIER_COUNT carriers"
            exit 1
          fi

          # Test 3: Upload sample CCF file
          echo "Test 3: Upload sample CCF file"
          UPLOAD_RESPONSE=$(curl -s -X POST -F "file=@sample-ccf.json;type=application/json" http://localhost:3001/api/ccf/upload)
          echo "Response: $UPLOAD_RESPONSE"
          echo "$UPLOAD_RESPONSE" | jq -e '.total > 0 and .new > 0' || exit 1
          echo "✅ CCF upload successful"

          # Test 4: Verify carriers were created
          echo "Test 4: Verify carriers exist after upload"
          CARRIERS_AFTER=$(curl -s http://localhost:3001/api/carriers)
          CARRIER_COUNT_AFTER=$(echo "$CARRIERS_AFTER" | jq 'length')
          if [ "$CARRIER_COUNT_AFTER" -gt 0 ]; then
            echo "✅ Found $CARRIER_COUNT_AFTER carriers in database"
          else
            echo "❌ No carriers found after upload"
            exit 1
          fi

          # Test 5: Hash-based change detection (re-upload same file)
          echo "Test 5: Hash-based change detection (re-upload identical file)"
          REUPLOAD_RESPONSE=$(curl -s -X POST -F "file=@sample-ccf.json;type=application/json" http://localhost:3001/api/ccf/upload)
          echo "Response: $REUPLOAD_RESPONSE"
          UNCHANGED_COUNT=$(echo "$REUPLOAD_RESPONSE" | jq '.unchanged')
          UPDATED_COUNT=$(echo "$REUPLOAD_RESPONSE" | jq '.updated')
          if [ "$UPDATED_COUNT" -eq 0 ] && [ "$UNCHANGED_COUNT" -gt 0 ]; then
            echo "✅ Hash detection working: $UNCHANGED_COUNT unchanged, $UPDATED_COUNT updated (zero recomputations)"
          else
            echo "❌ Hash detection failed: expected 0 updates, got $UPDATED_COUNT"
            exit 1
          fi

          # Test 6: Get specific carrier
          echo "Test 6: Get specific carrier by ID"
          FIRST_CARRIER_ID=$(echo "$CARRIERS_AFTER" | jq -r '.[0].carrierId')
          CARRIER_DETAIL=$(curl -s "http://localhost:3001/api/carriers/$FIRST_CARRIER_ID")
          echo "$CARRIER_DETAIL" | jq -e '.carrierId and .currentScore' || exit 1
          echo "✅ Carrier detail retrieval successful"

          # Test 7: Get carrier history
          echo "Test 7: Get carrier score history"
          CARRIER_HISTORY=$(curl -s "http://localhost:3001/api/carriers/$FIRST_CARRIER_ID/history")
          echo "$CARRIER_HISTORY" | jq -e 'length >= 0' || exit 1
          echo "✅ Carrier history retrieval successful"

          echo ""
          echo "🎉 All integration tests passed!"

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Backend API Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api
          echo "=== MongoDB Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs db

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping docker compose services..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          echo "✅ Cleanup complete"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, integration-test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "## CI Pipeline Results"
          echo ""
          echo "Parallel Jobs:"
          echo "- Lint: ${{ needs.lint.result }}"
          echo "- Test: ${{ needs.test.result }}"
          echo ""
          echo "Dependent Jobs:"
          echo "- Build: ${{ needs.build.result }} (depends on lint + test)"
          echo "- Integration: ${{ needs.integration-test.result }} (depends on lint + test)"
          echo ""

          if [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]] && \
             [[ "${{ needs.integration-test.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
