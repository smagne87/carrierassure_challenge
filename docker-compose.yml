# --- AI-ASSISTED ---
# Tool: Claude 4.5 Sonnet
# Prompt: "Create docker-compose configuration for MongoDB and NestJS backend with health checks and dependencies"
# Modifications: Added health checks, volumes, networks, proper service dependencies
# --- END AI-ASSISTED ---

services:
  # ========================================
  # MongoDB Database
  # ========================================
  db:
    image: mongo:7.0
    container_name: carrier-scoring-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: carrier-scoring
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================
  # Backend API (NestJS)
  # ========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: carrier-scoring-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://db:27017/carrier-scoring
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: debug
      MAX_FILE_SIZE_MB: 10
    volumes:
      # Mount source code for hot reload in development
      - ./backend/src:/app/src:ro
      - ./backend/node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  # ========================================
  # Frontend (Next.js)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: carrier-scoring-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      # Mount source code for hot reload in development
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

# ========================================
# Networks
# ========================================
networks:
  carrier-network:
    driver: bridge

# ========================================
# Volumes
# ========================================
volumes:
  mongodb_data:
    driver: local
