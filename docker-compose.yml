# Prompt: "Create production-ready docker-compose configuration"
# Modifications: Restructured for production defaults with development overrides
# --- END AI-ASSISTED ---

# ========================================
# PRODUCTION CONFIGURATION (Default)
# ========================================
# This file contains production-ready defaults.
# For development, use docker-compose.override.yml (auto-loaded)
# For CI, use: docker compose up (this file only)
# ========================================

services:
  # ========================================
  # MongoDB Database
  # ========================================
  db:
    image: mongo:7.0
    container_name: carrier-scoring-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: carrier-scoring
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================
  # Backend API (NestJS) - Production Build
  # ========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production  # Production target (compiled, optimized)
    container_name: carrier-scoring-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://db:27017/carrier-scoring
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      MAX_FILE_SIZE_MB: 10
    # NO volume mounts in production - use built-in code
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s  # Faster with production build

  # ========================================
  # Frontend (Next.js) - Production Build
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production  # Production target
    container_name: carrier-scoring-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    # NO volume mounts in production - use built-in code
    depends_on:
      api:
        condition: service_healthy
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s  # Faster with production build

# ========================================
# Networks
# ========================================
networks:
  carrier-network:
    driver: bridge

# ========================================
# Volumes
# ========================================
volumes:
  mongodb_data:
    driver: local
