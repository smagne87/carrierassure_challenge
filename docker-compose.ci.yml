# ========================================
# CI/CD OVERRIDES (Optional)
# ========================================
# This file provides CI-specific tweaks
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up
#
# Note: Since docker-compose.yml is now production-ready by default,
# this file is optional. You can use just: docker compose up
# ========================================

services:
  # ========================================
  # Backend API - CI Optimizations
  # ========================================
  api:
    # Force rebuild in CI (ignore cache)
    build:
      pull: true  # Always pull latest base image
      no_cache: false  # Allow Docker layer caching for speed
    # CI-specific container name to avoid conflicts
    container_name: carrier-scoring-api-ci

  # ========================================
  # Frontend - CI Optimizations
  # ========================================
  frontend:
    # Force rebuild in CI (ignore cache)
    build:
      pull: true  # Always pull latest base image
      no_cache: false  # Allow Docker layer caching for speed
    # CI-specific container name to avoid conflicts
    container_name: carrier-scoring-frontend-ci
