# Prompt: "Create development overrides for docker-compose"
# Modifications: Development-specific configuration with hot reload
# --- END AI-ASSISTED ---

# ========================================
# DEVELOPMENT OVERRIDES
# ========================================
# This file is automatically loaded by Docker Compose in development
# Usage: docker compose up (automatically merges with docker-compose.yml)
#
# To use production mode locally: docker compose -f docker-compose.yml up
# ========================================

services:
  # ========================================
  # Backend API - Development Mode
  # ========================================
  api:
    build:
      target: development  # Override to use development target
    container_name: carrier-scoring-api-dev
    environment:
      NODE_ENV: development  # Override to development
      LOG_LEVEL: debug       # More verbose logging
    volumes:
      # Mount source code for hot reload
      - ./backend/src:/app/src:ro
      # Mount node_modules to avoid reinstalling on every change
      - ./backend/node_modules:/app/node_modules
    healthcheck:
      start_period: 120s  # Development build takes longer to start

  # ========================================
  # Frontend - Development Mode
  # ========================================
  frontend:
    build:
      target: development  # Override to use development target
    container_name: carrier-scoring-frontend-dev
    environment:
      NODE_ENV: development  # Override to development
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      # Mount node_modules to avoid reinstalling on every change
      - ./frontend/node_modules:/app/node_modules
    healthcheck:
      start_period: 120s  # Development build takes longer to start
